
<!DOCTYPE html>

<html>
    <head>
        <title>
            Add Rating
        </title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header style = "text-align: center;">
            <h1>Add Rating</h1>
        </header>

        <nav style = "text-align: center;">
            <a href="index.html">Home Page</a>
            <a href="add-rating.html">Add Rating Page</a>
            <a href="recommendations.html">Recommendations Page</a>
        </nav>

        <main>
            <br><br>
            <form id="ratingForm" novalidate>
                <label for="name">Game title</label>
                <input type="text" id="name" name="name">

                <label for="rating">Your rating (1-10)</label>
                <input type="number" id="rating" name="rating" min="1" max="10">

                <br><br>
                <label for="genre">Genre</label>
                <input type="text" id="genre" name="genre">

                <label for="datePlayed">Date played</label>
                <input type="date" id="datePlayed" name="datePlayed">

                <br><br>
                <label for="review">Review</label><br>
                <textarea class="rating-textarea" id="review" name="review" maxlength="1000"></textarea>

                <br><br>
                <button type="submit">Submit</button>
                <p id="message"></p>
            </form>
        </main>

        <footer>
            
        </footer>
    <script src="add-rating.js"></script>
    </body>


</html>
