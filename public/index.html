
<!DOCTYPE html>

<html>
    <head>
        <title>
            Video Game Recommender
        </title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header style = "text-align: center;">
            <h1>Video Game Recommender</h1>
        </header>

        <nav style = "text-align: center;">
            <a href="index.html">Home Page</a>
            <a href="add-rating.html">Add Rating Page</a>
            <a href="recommendations.html">Recommendations Page</a>
        </nav> <br> <br>

        <main>
            <h2 style = "text-align: center;">My Ratings</h2>

                        <h3>Elden Ring</h3>
                        <div class="game-details">

                            <div class="detail-column">
                                <p><strong>Rating:</strong> 10/10</p>
                                <p><strong>Date Played:</strong> 10/11/2026</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="rating-box">Game 2 Info</div>
                <div class="rating-box">Game 3 Info</div>
                <div class="rating-box">Game 4 Info</div>
            </div>
        </main>

        <footer>
